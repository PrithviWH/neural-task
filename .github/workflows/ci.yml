name: NeuralTask Build & Test

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore NeuralTask.sln

    - name: Build solution
      run: dotnet build NeuralTask.sln --configuration Release --no-restore

    - name: Execute automated tests
      run: dotnet test NeuralTask.sln --configuration Release --no-build --verbosity normal
